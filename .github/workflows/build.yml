# Construye los instaladores de Mac y Windows en los servidores de GitHub.
# - Se ejecuta a mano desde la pestaña "Actions" (botón "Run workflow"),
# - o automáticamente al publicar una "Release" (por ejemplo v1.0.1),
#   y en ese caso sube los instaladores a esa Release para que cualquiera los descargue.
#
# Seguridad:
# - Cada acción está fijada a un commit exacto (el comentario indica su versión).
# - Por defecto solo hay permiso de lectura; solo el paso que publica puede escribir.
# - "npm ci" instala exactamente las versiones de package-lock.json.
name: Construir instaladores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de una Release ya publicada a la que adjuntar los instaladores (ej. v1.0.1). Vacío = solo compilar."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Construir instalador
        shell: bash
        # En Mac se crea un .dmg por arquitectura, uno detrás de otro:
        # si se crean a la vez, los dos discos temporales chocan (error "hdiutil detach").
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --arm64 --publish never
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
          ls -la dist
        env:
          # Sin certificado de firma: el instalador funciona, pero el sistema mostrará un aviso la primera vez.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instaladores
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reunir instaladores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Calcular sumas de verificación (SHA-256)
        working-directory: dist
        run: sha256sum *.dmg *.exe | tee SHA256SUMS.txt

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/*
          body: |
            ## Descargas
            - **Mac con chip Apple (M1, M2, M3, M4…):** archivo que termina en `mac-arm64.dmg`
            - **Mac con Intel:** archivo que termina en `mac-x64.dmg`
            - **Windows (instalador):** `Windows-Instalador.exe`
            - **Windows (sin instalar):** `Windows-Portable.exe`

            Funciona sin internet. Incluye la Reina-Valera 1909 y la King James Version (dominio público).

            **Primera vez en Mac:** si macOS dice que no puede verificar al desarrollador, ve a
            *Ajustes del Sistema → Privacidad y seguridad* y pulsa **Abrir de todos modos**.
            **Primera vez en Windows:** en "Windows protegió su PC" pulsa *Más información → Ejecutar de todas formas*.

            Para comprobar que tu descarga no fue alterada, compara su huella con `SHA256SUMS.txt`
            (Mac: `shasum -a 256 archivo` · Windows: `certutil -hashfile archivo SHA256`).
